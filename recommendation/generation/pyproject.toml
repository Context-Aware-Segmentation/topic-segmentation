[project]
name = "news-summary-generation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0+cu124",
  "transformers==5.9.0",
  "tokenizers==0.22.2",
  "huggingface-hub==1.17.0",
  "lm-format-enforcer==0.10.12",
  "accelerate==1.13.0",
  "numpy==2.2.6",
  "safetensors==0.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
