[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "news-recommendation"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0+cu124",
  "transformers==4.57.6",
  "numpy==2.2.6",
  "scikit-learn==1.8.0",
  "scipy==1.15.3",
  "protobuf==4.25.9",
  "safetensors==0.7.0",
  "pytest==8.4.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
