site_name: News Recommendation
site_description: MIND preparation, summary generation, and PLM-NR evaluation
site_url: https://mt-docs.pages.dev/recommendation/
site_dir: ../../tmp/recommendation-docs
use_directory_urls: false

theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - User guide: index.md
  - Setup: SETUP.md
  - API reference: api/
  - Build documentation: BUILD.md
  - Modules:
      - Documentation home: /index.html
      - Topic segmentation: /topic-segmentation/
      - Knowledge graph: /knowledge-graph/
      - Recommendation: /recommendation/

plugins:
  - search
  - offline
  - gen-files:
      scripts:
        - docs/generate.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            docstring_style: null
            show_if_no_docstring: true
            show_source: true
            show_signature_annotations: true
            members_order: source
            group_by_category: false
            heading_level: 2
            filters: ["!^_"]

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

exclude_docs: |
  generate.py
  api/SUMMARY.md

validation:
  links:
    not_found: warn
    anchors: warn

watch:
  - README.md
  - SETUP.md
  - src/news_recommendation
