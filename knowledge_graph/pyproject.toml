[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Entity recognition, entity linking, and relation extraction on news and clinical text"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0+cu124",
  "transformers==4.57.6",
  "datasets==2.14.7",
  "pyarrow==25.0.1",
  "accelerate==1.14.0",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "pandas==2.3.3",
  "spacy==3.7.5",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl",
  "spacy-entity-linker==1.0.3",
  "ijson==3.3.0",
  "relik==1.0.7",
  "gliner==0.2.27",
  "glirel==1.2.1",
  "loguru==0.7.3",
  "flair==0.15.1",
  "medcat==1.16.0",
  "fasthpocr==0.1.4",
  "stanza==1.1.1",
  "fasttext==0.9.3",
  "nltk==3.10.1",
  "prettytable==3.18.0",
  "sentence-transformers==5.5.1",
  "peft==0.19.1",
  "protobuf==5.29.6",
  "setuptools==80.9.0",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

# ReLiK 1.0.7 pins Torch 2.3.1 and Transformers 4.41, which cannot coexist
# with MedCAT and GLiNER. Use the shared versions for these model adapters.
[tool.uv]
override-dependencies = [
  "torch==2.6.0+cu124",
  "transformers==4.57.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/knowledge_graph/clinical/vendor"]  # vendored PhenoBERT and fastNLP
